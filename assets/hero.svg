<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Bridge Anything: software without an API, reverse engineered with REA into a bridge with REST, MCP and CLI that your app talks to">
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0d121e" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#0b0d12"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#2b4bf2"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0d121e" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#f7f8fa"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="118" font-size="56" font-weight="650" fill="#0b0d12" letter-spacing="-1.5">Bridge Anything</text>
  <text x="80" y="160" font-size="22" fill="#4a505c">Your app needs data from software without an API. Build the bridge.</text>

  <!-- Card 1: legacy app -->
  <g filter="url(#shadow)">
    <rect x="80" y="250" width="300" height="250" rx="12" fill="#ffffff" stroke="#0d121e" stroke-opacity="0.12"/>
  </g>
  <!-- old window -->
  <rect x="112" y="282" width="236" height="120" rx="6" fill="#eceef2" stroke="#0d121e" stroke-opacity="0.14"/>
  <rect x="112" y="282" width="236" height="22" rx="6" fill="#d9dce3"/>
  <rect x="112" y="296" width="236" height="8" fill="#d9dce3"/>
  <circle cx="126" cy="293" r="4" fill="#b8bdc8"/>
  <circle cx="140" cy="293" r="4" fill="#b8bdc8"/>
  <rect x="126" y="318" width="90" height="8" rx="2" fill="#c3c8d2"/>
  <rect x="126" y="334" width="208" height="8" rx="2" fill="#d3d7df"/>
  <rect x="126" y="350" width="170" height="8" rx="2" fill="#d3d7df"/>
  <rect x="126" y="366" width="190" height="8" rx="2" fill="#d3d7df"/>
  <rect x="126" y="382" width="120" height="8" rx="2" fill="#d3d7df"/>
  <!-- database -->
  <g transform="translate(300 360)">
    <ellipse cx="0" cy="0" rx="30" ry="9" fill="#ffffff" stroke="#0b0d12" stroke-width="1.6"/>
    <path d="M-30 0 V38 A30 9 0 0 0 30 38 V0" fill="#ffffff" stroke="#0b0d12" stroke-width="1.6"/>
    <path d="M-30 19 A30 9 0 0 0 30 19" fill="none" stroke="#0b0d12" stroke-width="1.6"/>
  </g>
  <text x="112" y="446" font-size="22" font-weight="600" fill="#0b0d12">Legacy app</text>
  <text x="112" y="474" font-size="16" fill="#5c6270">On-premise, no API</text>

  <!-- Arrow 1 with REA label -->
  <line x1="392" y1="375" x2="478" y2="375" stroke="#0b0d12" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="396" y="322" width="76" height="30" rx="6" fill="#0b0d12"/>
  <text x="434" y="343" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">REA</text>
  <text x="434" y="406" font-size="13" fill="#5c6270" text-anchor="middle">reverse</text>
  <text x="434" y="423" font-size="13" fill="#5c6270" text-anchor="middle">engineer</text>

  <!-- Card 2: the bridge -->
  <g filter="url(#shadow)">
    <rect x="490" y="250" width="300" height="250" rx="12" fill="#ffffff" stroke="#2b4bf2" stroke-opacity="0.55" stroke-width="1.5"/>
  </g>
  <!-- bridge arc -->
  <g transform="translate(522 282)" fill="none" stroke="#2b4bf2" stroke-width="2.2" stroke-linecap="round">
    <path d="M0 78 H236"/>
    <path d="M14 78 Q118 -6 222 78"/>
    <path d="M44 78 V57.5 M74 78 V43.5 M104 78 V37 M134 78 V37.5 M164 78 V44.5 M194 78 V58.5"/>
  </g>
  <g class="mono" font-size="14" font-weight="500">
    <rect x="522" y="380" width="68" height="28" rx="5" fill="#eef1ff"/>
    <text x="556" y="399" fill="#2140d8" text-anchor="middle" class="mono">REST</text>
    <rect x="606" y="380" width="68" height="28" rx="5" fill="#eef1ff"/>
    <text x="640" y="399" fill="#2140d8" text-anchor="middle" class="mono">MCP</text>
    <rect x="690" y="380" width="68" height="28" rx="5" fill="#eef1ff"/>
    <text x="724" y="399" fill="#2140d8" text-anchor="middle" class="mono">CLI</text>
  </g>
  <text x="522" y="446" font-size="22" font-weight="600" fill="#0b0d12">Your bridge</text>
  <text x="522" y="474" font-size="16" fill="#5c6270">Typed contract, runs on site</text>

  <!-- Arrow 2 -->
  <line x1="802" y1="375" x2="888" y2="375" stroke="#2b4bf2" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
  <text x="844" y="358" font-size="13" fill="#5c6270" text-anchor="middle">connect</text>

  <!-- Card 3: your app -->
  <g filter="url(#shadow)">
    <rect x="900" y="250" width="300" height="250" rx="12" fill="#ffffff" stroke="#0d121e" stroke-opacity="0.12"/>
  </g>
  <!-- app header -->
  <rect x="932" y="282" width="236" height="122" rx="8" fill="#ffffff" stroke="#0d121e" stroke-opacity="0.12"/>
  <rect x="944" y="294" width="14" height="14" rx="4" fill="#2b4bf2"/>
  <rect x="966" y="297" width="64" height="8" rx="2" fill="#c3c8d2"/>
  <rect x="1124" y="294" width="32" height="14" rx="4" fill="#0b0d12"/>
  <line x1="932" y1="318" x2="1168" y2="318" stroke="#0d121e" stroke-opacity="0.08"/>
  <!-- appointment rows -->
  <g>
    <rect x="944" y="328" width="38" height="16" rx="4" fill="#eef1ff"/>
    <text x="963" y="340" font-size="10" fill="#2140d8" text-anchor="middle" class="mono">09:00</text>
    <rect x="992" y="332" width="104" height="8" rx="2" fill="#c3c8d2"/>
    <circle cx="1150" cy="336" r="3.5" fill="#1f9d55"/>
  </g>
  <g>
    <rect x="944" y="352" width="38" height="16" rx="4" fill="#eef1ff"/>
    <text x="963" y="364" font-size="10" fill="#2140d8" text-anchor="middle" class="mono">10:30</text>
    <rect x="992" y="356" width="80" height="8" rx="2" fill="#c3c8d2"/>
    <circle cx="1150" cy="360" r="3.5" fill="#1f9d55"/>
  </g>
  <g>
    <rect x="944" y="376" width="38" height="16" rx="4" fill="#eef1ff"/>
    <text x="963" y="388" font-size="10" fill="#2140d8" text-anchor="middle" class="mono">11:15</text>
    <rect x="992" y="380" width="118" height="8" rx="2" fill="#c3c8d2"/>
    <circle cx="1150" cy="384" r="3.5" fill="#d08a0b"/>
  </g>
  <text x="932" y="446" font-size="22" font-weight="600" fill="#0b0d12">Your app</text>
  <text x="932" y="474" font-size="16" fill="#5c6270">Or your agent, finally with the data</text>

  <!-- Footer -->
  <text x="80" y="580" font-size="16" fill="#5c6270" class="mono">npx skills add artesiana/bridge-anything</text>
</svg>
